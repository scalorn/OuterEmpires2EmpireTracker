  /api/v1/characters/{uuid}/stockPlans:
    get:
      operationId: GetStockPlans
      summary: Get stock plans for a character
      description: Returns all stock plans owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      responses:
        '200':
          description: List of stock plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockPlan'
        '403':
