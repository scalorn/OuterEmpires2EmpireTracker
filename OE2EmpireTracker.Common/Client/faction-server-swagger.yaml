      operationId: GetSurveys
      summary: Get surveys for a character
      description: Returns all surveys owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      responses:
        '200':
          description: List of surveys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
        '403':
