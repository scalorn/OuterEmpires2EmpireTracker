openapi: 3.0.3
info:
  title: Faction Server API
  version: 1.0.0
  description: >
    OpenAPI specification for the Faction Server API. Covers server administration,
    character management, and sync endpoints.

servers:
  - url: https://faction.example.com
    description: Faction Server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ServerFaction:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier for the faction
        name:
          type: string
          description: Faction display name
        description:
          type: string
          description: Faction description text
        leaderCharacterUUIDs:
          type: array
          items:
            type: string
          description: UUIDs of characters who lead this faction
      required:
        - uuid
        - name
        - description
        - leaderCharacterUUIDs

    ServerCharacter:
      type: object
      properties:
        uuid:
          type: string
          description: Unique identifier for the character
        name:
          type: string
          description: Character display name
        factionUUID:
          type: string
          nullable: true
          description: UUID of the faction this character belongs to (null if unaffiliated)
      required:
        - uuid
        - name

    SyncResponse:
      type: object
      properties:
        factions:
          type: array
          items:
            $ref: '#/components/schemas/ServerFaction'
          description: All server-level factions
        characters:
          type: array
          items:
            $ref: '#/components/schemas/ServerCharacter'
          description: All server-level characters
        serverTimestamp:
          type: string
          format: date-time
          description: Server timestamp of the snapshot
      required:
        - factions
        - characters
        - serverTimestamp

    CreateCharacterRequest:
      type: object
      properties:
        name:
          type: string
          description: Character name (required)
        uuid:
          type: string
          description: Optional UUID to assign to the character
      required:
        - name

    Colony:
      type: object
      description: A player colony with structures, resources, and processing state

    Blueprint:
      type: object
      description: A blueprint owned by a character for manufacturing items

    Survey:
      type: object
      description: A planet or asteroid resource survey

    PlayerProfile:
      type: object
      description: A player profile with skills, rank, and profession data

    DeliveryRoute:
      type: object
      description: A delivery route defining waypoints between colonies

    DeliveryPlan:
      type: object
      description: A delivery plan specifying commodities to transport along a route

    Ship:
      type: object
      description: A ship instance owned by a character

    ShipTemplate:
      type: object
      description: A ship template defining slot configuration and hull type

    MarketListing:
      type: object
      description: A market listing for buying or selling commodities

    MarketTransaction:
      type: object
      description: A completed market transaction record

    PricingPlan:
      type: object
      description: A pricing plan defining buy/sell prices for commodities at a colony

    StockPlan:
      type: object
      description: A stock plan defining target inventory levels for a colony

    StockProfile:
      type: object
      description: A stock profile grouping multiple stock plans

    BuildPlan:
      type: object
      description: A build plan defining structure construction goals for a colony

    SupplyChain:
      type: object
      description: A supply chain linking production and consumption across colonies

    Asteroid:
      type: object
      description: An asteroid with mining resource data

    Station:
      type: object
      description: A space station with docking and trade facilities

    Faction:
      type: object
      description: A player-level faction contact record

    ExternalCharacter:
      type: object
      description: An external character record for contacts and sharing

    PlayerRoot:
      type: object
      description: Complete player data export containing all character entities

    BaselineRoot:
      type: object
      description: Baseline game data (blueprint types, ship classes, commodities, etc.)

    BulkImportResult:
      type: object
      properties:
        imported:
          type: object
          additionalProperties:
            type: integer
          description: Dictionary of collection names to imported entity counts
        total:
          type: integer
          description: Total number of entities imported
      required:
        - imported
        - total

    BulkImportRequest:
      type: object
      description: PlayerRoot containing all character data for import

    SharingRuleDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the sharing rule
        ownerCharacterUUID:
          type: string
          description: UUID of the character who owns the shared data
        targetUUID:
          type: string
          description: UUID of the target (character or faction) receiving access
        targetType:
          type: string
          description: Type of target (e.g. character, faction)
        dataType:
          type: string
          description: Type of data being shared (e.g. colonies, blueprints)
        entityUUID:
          type: string
          description: UUID of the specific entity being shared (or empty for all)
      required:
        - id
        - ownerCharacterUUID
        - targetUUID
        - targetType
        - dataType
        - entityUUID

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              entityType:
                type: string
                description: Type of entity that failed validation
              entityUUID:
                type: string
                description: UUID of the entity that failed validation
              field:
                type: string
                description: Field that failed validation
              error:
                type: string
                description: Validation error message
            required:
              - entityType
              - entityUUID
              - field
              - error
      required:
        - errors

paths:
  /health:
    get:
      operationId: CheckHealth
      summary: Check server health
      description: Returns 200 if the server is healthy
      security: []
      responses:
        '200':
          description: Server is healthy
        '503':
          description: Server is unhealthy

  /api/v1/factions:
    get:
      operationId: GetFactions
      summary: List all factions
      description: Returns all server-level factions
      responses:
        '200':
          description: List of factions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerFaction'
        '403':
          description: Unauthorized

  /api/v1/characters:
    get:
      operationId: GetCharacters
      summary: List all characters
      description: Returns all server-level characters
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerCharacter'
        '403':
          description: Unauthorized

    post:
      operationId: CreateCharacter
      summary: Create a character
      description: Creates a new character on the server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterRequest'
      responses:
        '201':
          description: Character created successfully
        '400':
          description: Validation error (e.g. name already taken)
        '403':
          description: Unauthorized

  /api/v1/sync/snapshot:
    get:
      operationId: GetSyncSnapshot
      summary: Get sync snapshot
      description: >
        Returns a snapshot of all server-level factions, characters,
        and the current server timestamp for divergence detection.
      responses:
        '200':
          description: Sync snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '403':
          description: Unauthorized

  /api/v1/characters/{uuid}/colonies:
    get:
      operationId: GetColonies
      summary: Get colonies for a character
      description: Returns all colonies owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      responses:
        '200':
          description: List of colonies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Colony'
        '403':
          description: Unauthorized

  /api/v1/characters/{uuid}/blueprints:
    get:
      operationId: GetBlueprints
      summary: Get blueprints for a character
      description: Returns all blueprints owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
