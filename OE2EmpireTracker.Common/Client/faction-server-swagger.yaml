  /api/v1/characters/{uuid}/import:
    put:
      operationId: BulkImport
      summary: Bulk import character data
      description: Imports all character data from a PlayerRoot payload
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
      responses:
        '200':
          description: Import completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResult'
        '400':
          description: Validation errors in the import data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Unauthorized

  /api/v1/global/baseline:
