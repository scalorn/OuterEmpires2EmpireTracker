          description: List of sharing rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharingRuleDto'
        '403':
          description: Unauthorized

    put:
      operationId: PutSharingRules
      summary: Replace sharing rules for a character
      description: Replaces all sharing rules for the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingRuleDto'
      responses:
        '204':
          description: Sharing rules replaced successfully
        '403':
          description: Unauthorized
