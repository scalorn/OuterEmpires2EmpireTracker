  /api/v1/characters/{uuid}/deliveryRoutes:
    get:
      operationId: GetDeliveryRoutes
      summary: Get delivery routes for a character
      description: Returns all delivery routes owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
