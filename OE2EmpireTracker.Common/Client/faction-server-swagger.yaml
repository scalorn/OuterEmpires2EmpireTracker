  /api/v1/characters/{uuid}/playerProfiles:
    get:
      operationId: GetPlayerProfiles
      summary: Get player profiles for a character
      description: Returns all player profiles for the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
          description: Character UUID
      responses:
        '200':
          description: List of player profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerProfile'
        '403':
