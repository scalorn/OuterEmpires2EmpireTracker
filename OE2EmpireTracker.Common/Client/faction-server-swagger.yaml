      operationId: UploadBaseline
      summary: Upload baseline data
      description: Uploads baseline game data (blueprint types, ship classes, commodities, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineRoot'
      responses:
        '204':
          description: Baseline data uploaded successfully
        '403':
          description: Unauthorized

  /api/v1/characters/{uuid}/export:
    get:
      operationId: ExportCharacterData
      summary: Export all character data
      description: Exports all data for the specified character as a PlayerRoot object
      parameters:
