          schema:
            type: string
          description: Character UUID
      responses:
        '200':
          description: List of ship templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipTemplate'
        '403':
          description: Unauthorized

  /api/v1/characters/{uuid}/marketListings:
    get:
      operationId: GetMarketListings
      summary: Get market listings for a character
      description: Returns all market listings owned by the specified character
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
